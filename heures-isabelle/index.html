<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Mise en page : une colonne étroite pour téléphone, cartes de jour empilées, barre d'action fixe en bas */
:root{
  --bg:#f2f6f3; --surface:#ffffff; --fg:#14231c; --muted:#56665e; --line:#d3ddd7;
  --accent:#17734d; --on-accent:#ffffff; --accent-soft:#dff0e6;
  --leave:#2f4aa0; --leave-soft:#e3e8f8; --hol:#7a5000; --hol-soft:#fbefd2;
  --rest-soft:#eef2ef; --danger:#b3261e; --shade:rgba(10,25,18,.45);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1814; --surface:#16231d; --fg:#e8f1ec; --muted:#9bb0a5; --line:#2a3b33;
  --accent:#5ccf9b; --on-accent:#08261a; --accent-soft:#1b3a2d;
  --leave:#a9b9ff; --leave-soft:#222c52; --hol:#f0c36a; --hol-soft:#3a2e12;
  --rest-soft:#1a2a23; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1814; --surface:#16231d; --fg:#e8f1ec; --muted:#9bb0a5; --line:#2a3b33;
  --accent:#5ccf9b; --on-accent:#08261a; --accent-soft:#1b3a2d;
  --leave:#a9b9ff; --leave-soft:#222c52; --hol:#f0c36a; --hol-soft:#3a2e12;
  --rest-soft:#1a2a23; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 120px}
body.noscroll{overflow:hidden}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.brand h1{font-family:var(--font-display);font-size:1.9rem;line-height:1.1;font-weight:700;text-wrap:balance}
.brand .sub{color:var(--muted);margin-top:4px}
.brand .sub strong{color:var(--fg)}
.brand .month{font-family:var(--font-display);font-size:1.55rem;font-weight:700;color:var(--accent);margin-top:10px}
.notice{background:var(--hol-soft);color:var(--hol);border-radius:10px;padding:10px 12px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border:2px solid var(--accent);
  background:var(--accent);color:var(--on-accent);border-radius:12px;font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:44px;padding:8px 12px;font-size:.95rem}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.datebtn{position:relative;overflow:hidden}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.weekbar{display:flex;flex-direction:column;gap:12px}
.wkhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wkn{font-family:var(--font-display);font-weight:700;font-size:2.3rem;line-height:1}
.wkn small{font-family:var(--font-body);font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:8px}
.wkr{color:var(--muted);font-weight:500}
.par{margin-left:auto;font-size:.8rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px}
.day.today{border:2px solid var(--accent)}
.day.leave{background:var(--leave-soft)}
.day.rest{background:var(--rest-soft)}
.dn{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.dname{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dnum{font-family:var(--font-display);font-size:2rem;font-weight:700}
.dmon{font-size:.8rem;color:var(--muted)}
.dbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.tag.hol{background:var(--hol-soft);color:var(--hol)}
.tag.lv{background:var(--leave);color:var(--surface)}
.tag.mod{background:transparent;border:1px solid var(--accent)}
.plan{font-weight:600}
.plan .none{color:var(--muted);font-weight:500}
.plan small{display:block;color:var(--muted);font-weight:500}
.otline{color:var(--accent);font-weight:700}
.btns{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns .btn{flex:1 1 150px}
.wktot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.wktot span:last-child{color:var(--accent)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .wrap{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);
  border-radius:999px;padding:10px 18px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

.mnav{display:flex;align-items:center;gap:8px}
.mnav .mlabel{flex:1;text-align:center;font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.mnav .btn{min-width:48px;flex:0 0 auto;padding-inline:14px}
.remind{border:2px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft);color:var(--fg)}
.remind strong{color:var(--accent)}
.remind small{display:block;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile span{display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile strong{font-family:var(--font-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.tile.main strong{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rec{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:.88rem;font-variant-numeric:tabular-nums}
.rec th{background:var(--rest-soft);text-align:left;font-weight:700;padding:8px 8px;border-bottom:2px solid var(--fg);vertical-align:bottom;line-height:1.15}
.rec th small{font-weight:500;color:var(--muted)}
.rec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rec .r{text-align:right}
.rec tr{--row-bg:var(--surface);background:var(--row-bg)}
.rec td.d{position:sticky;left:0;background:var(--row-bg);font-weight:700;white-space:nowrap}
.rec tr.rest{--row-bg:var(--rest-soft);color:var(--muted)}
.rec tr.leave{--row-bg:var(--leave-soft);font-weight:700}
.rec tr.hol td.d{box-shadow:inset 3px 0 0 var(--hol)}
.rec tr.wk td{background:var(--line);font-weight:700;position:static}
.rec tr.wkleave td{background:var(--leave);color:var(--surface)}
.rec tfoot td{font-weight:700;background:var(--rest-soft);border-top:2px solid var(--fg);border-bottom:0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.fld input,.fld textarea,.fld select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:48px;font-size:16px;width:100%}
textarea{min-height:110px;resize:vertical;font-weight:400}
.status{min-height:1.4em;color:var(--muted);font-weight:600}

.sheet-back{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--font-display);font-size:1.4rem}
.sheet .ctx{color:var(--muted);margin-top:-8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted)}
.calc{font-weight:700;color:var(--accent);min-height:1.4em}
.err{color:var(--danger);font-weight:700;min-height:1.2em}
.sbtns{display:flex;flex-direction:column;gap:8px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;font-size:.92rem;padding:0;margin-bottom:6px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.types label{flex:1 1 110px;position:relative}
.types input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.types span{display:flex;align-items:center;justify-content:center;min-height:48px;border:2px solid var(--line);border-radius:12px;font-weight:700;text-align:center;padding:6px}
.types input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.types input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
<div id="app" class="wrap"></div>
<div id="dock" class="dock"><div class="wrap" id="dockin"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheetBack" class="sheet-back" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<script>
/*LOGIC-START*/
var DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
var DAYS3=['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'];
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MON3=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var LEAVE_LABEL={CP:'Congé payé',Maladie:'Maladie',Autre:'Autre congé'};

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function mondayOf(d){return addDays(d,-((d.getDay()+6)%7));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function isoWeek(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn=(t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-dn+3);
  var ft=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-ft)/86400000-3+((ft.getUTCDay()+6)%7))/7);
}
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function hm(m){return Math.floor(m/60)+'h'+pad(m%60);}
function tfmt(t){var p=t.split(':');return (+p[0])+'h'+p[1];}
function slotTxt(s){return tfmt(s[0])+' - '+tfmt(s[1]);}

function easter(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
      g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da,12);
}
var holCache={};
function holidaysOf(y){
  if(holCache[y])return holCache[y];
  var m={};
  function add(d,n){m[ymd(d)]=n;}
  var e=easter(y);
  add(new Date(y,0,1,12),"Jour de l'An");
  add(addDays(e,1),'Lundi de Pâques');
  add(new Date(y,4,1,12),'Fête du Travail');
  add(new Date(y,4,8,12),'Victoire 1945');
  add(addDays(e,39),'Ascension');
  add(addDays(e,50),'Lundi de Pentecôte');
  add(new Date(y,6,14,12),'Fête nationale');
  add(new Date(y,7,15,12),'Assomption');
  add(new Date(y,10,1,12),'Toussaint');
  add(new Date(y,10,11,12),'Armistice');
  add(new Date(y,11,25,12),'Noël');
  holCache[y]=m;return m;
}
function holiday(ds){return holidaysOf(+ds.slice(0,4))[ds]||null;}

/* Planning type d'Isabelle */
function planned(d){
  var wd=(d.getDay()+6)%7;
  if(wd<=2)return [['09:00','12:30'],['14:00','19:30']];
  if(wd===3)return [['09:00','12:30']];
  if(wd===5&&isoWeek(d)%2===1)return [['09:00','12:00'],['13:00','19:00']];
  return [];
}
function info(ds,S){
  var d=parse(ds),wd=(d.getDay()+6)%7,wk=isoWeek(d);
  var leave=S.leave[ds]||null,slots,src;
  if(leave){slots=[];src='leave';}
  else if(S.days[ds]){slots=S.days[ds].slots||[];src='custom';}
  else{slots=planned(d);src='default';}
  var ot=(!leave&&S.ot[ds])?S.ot[ds]:null;
  var base=0;slots.forEach(function(s){base+=Math.max(0,mins(s[1])-mins(s[0]));});
  var otm=ot?Math.max(0,mins(ot.end)-mins(ot.start)):0;
  return {ds:ds,d:d,wd:wd,wk:wk,leave:leave,slots:slots,src:src,ot:otm>0?ot:null,base:base,otm:otm,total:base+otm,hol:holiday(ds)};
}
function rowOf(x){
  var ment=[];
  if(x.leave)ment.push(LEAVE_LABEL[x.leave]);
  if(x.hol)ment.push('Férié ('+x.hol+')');
  if(x.src==='custom'&&!x.leave)ment.push('Horaires modifiés');
  return {
    jour:DAYS3[x.wd]+' '+x.d.getDate(),
    hor:x.leave?'-':(x.slots.length?x.slots.map(slotTxt).join(' / '):'Repos'),
    sup:x.ot?tfmt(x.ot.start)+' - '+tfmt(x.ot.end):'',
    supDur:x.otm>0?hm(x.otm):'',
    total:x.total>0?hm(x.total):'-',
    ment:ment.join(' / ')
  };
}
function monthModel(y,m,S){
  var n=new Date(y,m+1,0).getDate(),days=[],groups=[],i;
  for(i=1;i<=n;i++)days.push(info(y+'-'+pad(m+1)+'-'+pad(i),S));
  days.forEach(function(x){
    var g=groups[groups.length-1];
    if(!g||g.wk!==x.wk){g={wk:x.wk,days:[]};groups.push(g);}
    g.days.push(x);
  });
  var st={sup:0,total:0,cp:0,mal:0,aut:0};
  days.forEach(function(x){
    st.sup+=x.otm;st.total+=x.total;
    if(x.leave==='CP')st.cp++;else if(x.leave==='Maladie')st.mal++;else if(x.leave==='Autre')st.aut++;
  });
  groups.forEach(function(g){
    var a=g.days[0].d,b=g.days[g.days.length-1].d;
    var rng='du '+a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON3[a.getMonth()]:'')+' au '+b.getDate()+' '+MON3[b.getMonth()];
    var c={CP:0,Maladie:0,Autre:0},lp=[];
    g.days.forEach(function(x){if(x.leave)c[x.leave]++;});
    if(c.CP)lp.push('Congé payé : '+c.CP+' j');
    if(c.Maladie)lp.push('Maladie : '+c.Maladie+' j');
    if(c.Autre)lp.push('Autre congé : '+c.Autre+' j');
    g.hasLeave=lp.length>0;
    g.header='Semaine '+g.wk+' ('+rng+')'+(lp.length?'  -  '+lp.join(', '):'');
  });
  return {y:y,m:m,days:days,groups:groups,st:st};
}

/* ---------- PDF (noir et blanc) ---------- */
function buildPdf(jsPDF,M,comment){
  var doc=new jsPDF({unit:'mm',format:'a4'});
  var W=210,ML=14,MR=14,CW=W-ML-MR;
  doc.setTextColor(20);
  doc.setFont('helvetica','bold');doc.setFontSize(17);
  doc.text('Pharmacie Centrale',ML,16);
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  doc.text('Relevé mensuel des heures',ML,22);
  doc.setFont('helvetica','bold');
  doc.text('Salariée : Isabelle SAUCET',W-MR,16,{align:'right'});
  doc.text('Mois : '+MONTHS[M.m]+' '+M.y,W-MR,22,{align:'right'});
  doc.setDrawColor(20);doc.setLineWidth(0.5);doc.line(ML,25.5,W-MR,25.5);

  var body=[];
  M.groups.forEach(function(g){
    body.push([{content:g.header,colSpan:6,styles:{fontStyle:'bold',fillColor:[205,205,205],textColor:0,halign:'left'}}]);
    g.days.forEach(function(x){
      var r=rowOf(x),st={};
      if(x.leave)st={fillColor:[228,228,228],fontStyle:'bold'};
      else if(!x.slots.length&&!x.ot)st={textColor:[110,110,110]};
      body.push([r.jour,r.hor,r.sup,r.supDur,r.total,r.ment].map(function(t){
        return {content:t,styles:Object.assign({},st)};
      }));
    });
  });
  doc.autoTable({
    startY:29,
    head:[['Jour','Horaires','Heures sup (de - à)','Durée sup','Total jour','Mention']],
    body:body,
    foot:[[{content:'Total du mois',colSpan:3,styles:{halign:'right'}},hm(M.st.sup),hm(M.st.total),'']],
    showFoot:'lastPage',theme:'grid',
    margin:{left:ML,right:MR,bottom:14},
    styles:{font:'helvetica',fontSize:7.5,cellPadding:{top:0.8,bottom:0.8,left:1.5,right:1.5},lineColor:[90,90,90],lineWidth:0.15,textColor:20,valign:'middle'},
    headStyles:{fillColor:[235,235,235],textColor:0,fontStyle:'bold',lineWidth:0.3,lineColor:[20,20,20]},
    footStyles:{fillColor:[235,235,235],textColor:0,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:20},1:{cellWidth:46},2:{cellWidth:30},3:{cellWidth:16,halign:'right'},4:{cellWidth:16,halign:'right'},5:{cellWidth:'auto'}}
  });

  var y=doc.lastAutoTable.finalY+7;
  var cl=comment?doc.splitTextToSize(comment,CW-4):[];
  var boxH=Math.max(16,cl.length*4+5);
  var need=24+boxH+8+16+6;
  if(y+need>297-12){doc.addPage();y=18;}
  doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Total des heures supplémentaires du mois : '+hm(M.st.sup),ML,y);y+=5.5;
  doc.setFont('helvetica','normal');
  doc.text('Jours de congé payé : '+M.st.cp,ML,y);y+=5;
  doc.text('Jours de maladie : '+M.st.mal,ML,y);y+=5;
  if(M.st.aut){doc.text('Autres congés : '+M.st.aut+' jour'+(M.st.aut>1?'s':''),ML,y);y+=5;}
  y+=2;
  doc.setFont('helvetica','bold');doc.text('Commentaire du mois :',ML,y);y+=1.8;
  doc.setDrawColor(90);doc.setLineWidth(0.2);doc.rect(ML,y,CW,boxH);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  if(cl.length)doc.text(cl,ML+2,y+4.5);
  y+=boxH+7;
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Visa de la salariée :',ML,y);

  doc.rect(ML,y+1.5,CW/2-3,14);doc.rect(W/2+3,y+1.5,CW/2-3,14);
  return doc;
}

/* ---------- Excel ---------- */
function buildXlsx(ExcelJS,M,comment){
  var wb=new ExcelJS.Workbook();wb.creator='Isabelle Saucet';wb.created=new Date();
  var ws=wb.addWorksheet('Relevé '+MON3[M.m].replace('.','')+' '+M.y,{
    pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}},
    views:[{showGridLines:false}]
  });
  ws.columns=[{width:14},{width:34},{width:20},{width:11},{width:11},{width:36}];
  var thin={style:'thin',color:{argb:'FF555555'}};
  var FMT='[h]:mm';
  function box(c){c.border={top:thin,left:thin,bottom:thin,right:thin};}
  function fill(c,hex){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}};}

  ws.getCell('A1').value='Pharmacie Centrale';ws.getCell('A1').font={bold:true,size:16};
  ws.getCell('A2').value='Relevé mensuel des heures';ws.getCell('A2').font={size:11};
  ws.mergeCells('D1:F1');ws.getCell('D1').value='Salariée : Isabelle SAUCET';
  ws.getCell('D1').font={bold:true,size:11};ws.getCell('D1').alignment={horizontal:'right'};
  ws.mergeCells('D2:F2');ws.getCell('D2').value='Mois : '+MONTHS[M.m]+' '+M.y;
  ws.getCell('D2').font={bold:true,size:11};ws.getCell('D2').alignment={horizontal:'right'};

  var r=4;
  ['Jour','Horaires','Heures sup (de - à)','Durée sup','Total jour','Mention'].forEach(function(t,i){
    var c=ws.getCell(r,i+1);c.value=t;c.font={bold:true};fill(c,'EBEBEB');box(c);
    c.alignment={vertical:'middle',horizontal:(i===3||i===4)?'right':'left',wrapText:true};
  });
  var first=r+1;
  M.groups.forEach(function(g){
    r++;ws.mergeCells(r,1,r,6);
    var c=ws.getCell(r,1);c.value=g.header;c.font={bold:true};fill(c,'CDCDCD');
    for(var k=1;k<=6;k++)box(ws.getCell(r,k));
    g.days.forEach(function(x){
      r++;var d=rowOf(x);
      var vals=[d.jour,d.hor,d.sup,x.otm>0?x.otm/1440:null,x.total>0?x.total/1440:null,d.ment];
      var rest=!x.leave&&!x.slots.length&&!x.ot;
      vals.forEach(function(v,i){
        var cell=ws.getCell(r,i+1);cell.value=v;box(cell);
        cell.alignment={vertical:'middle',horizontal:(i===3||i===4)?'right':'left',wrapText:true};
        if(i===3||i===4)cell.numFmt=FMT;
        if(x.leave){cell.font={bold:true};fill(cell,'E4E4E4');}
        else if(rest){cell.font={color:{argb:'FF6E6E6E'}};}
      });
    });
  });
  var last=r;r++;
  var tr=r;
  ws.mergeCells(tr,1,tr,3);
  var tl=ws.getCell(tr,1);tl.value='Total du mois';tl.font={bold:true};tl.alignment={horizontal:'right'};
  var te=ws.getCell(tr,4);te.value={formula:'SUM(D'+first+':D'+last+')',result:M.st.sup/1440};
  var tt=ws.getCell(tr,5);tt.value={formula:'SUM(E'+first+':E'+last+')',result:M.st.total/1440};
  for(var k=1;k<=6;k++){var cc=ws.getCell(tr,k);box(cc);fill(cc,'EBEBEB');cc.font={bold:true};}
  te.numFmt=FMT;tt.numFmt=FMT;te.alignment={horizontal:'right'};tt.alignment={horizontal:'right'};

  r+=2;
  ws.getCell(r,1).value='Total des heures supplémentaires du mois';ws.getCell(r,1).font={bold:true};
  var sv=ws.getCell(r,4);sv.value={formula:'D'+tr,result:M.st.sup/1440};sv.numFmt=FMT;sv.font={bold:true};sv.alignment={horizontal:'right'};
  r++;ws.getCell(r,1).value='Jours de congé payé';ws.getCell(r,4).value=M.st.cp;ws.getCell(r,4).alignment={horizontal:'right'};
  r++;ws.getCell(r,1).value='Jours de maladie';ws.getCell(r,4).value=M.st.mal;ws.getCell(r,4).alignment={horizontal:'right'};
  if(M.st.aut){r++;ws.getCell(r,1).value='Autres congés (jours)';ws.getCell(r,4).value=M.st.aut;ws.getCell(r,4).alignment={horizontal:'right'};}
  r+=2;
  ws.getCell(r,1).value='Commentaire du mois :';ws.getCell(r,1).font={bold:true};
  r++;ws.mergeCells(r,1,r,6);
  var cm=ws.getCell(r,1);cm.value=comment||'';cm.alignment={wrapText:true,vertical:'top'};
  for(var k2=1;k2<=6;k2++)box(ws.getCell(r,k2));
  ws.getRow(r).height=Math.max(45,Math.ceil((comment||'').length/85+((comment||'').split('\n').length-1))*15+10);
  r+=2;
  ws.getCell(r,1).value='Visa de la salariée :';ws.getCell(r,1).font={bold:true};
  ws.getCell(r,4).value="Visa du chef d'entreprise :";ws.getCell(r,4).font={bold:true};
  r++;ws.getRow(r).height=48;
  ws.mergeCells(r,1,r,3);ws.mergeCells(r,4,r,6);
  for(var k3=1;k3<=6;k3++)box(ws.getCell(r,k3));
  return wb;
}

<script>

function brand(label){

}
function plannedFor(ds){var o=S.days[ds];return o?o.slots:planned(parse(ds));}
function dayTitle(x){return DAYS[x.wd]+' '+x.d.getDate()+' '+MONTHS[x.d.getMonth()];}

/* ---------------- Page 1 : semaine ---------------- */
function renderWeek(){

    supW+=x.otm;totW+=x.total;

    var tags='';
    if(x.ds===ymd(today))tags+='<span class="tag">Aujourd\'hui</span>';
    if(x.hol)tags+='<span class="tag hol">Férié · '+esc(x.hol)+'</span>';
    if(x.leave)tags+='<span class="tag lv">'+esc(LEAVE_LABEL[x.leave])+'</span>';

    h+='<article class="'+cls+'"><div class="dn"><span class="dname">'+DAYS3[x.wd]+'</span><span class="dnum">'+x.d.getDate()+'</span><span class="dmon">'+MON3[x.d.getMonth()]+'</span></div>';
    h+='<div class="dbody">'+(tags?'<div class="tags">'+tags+'</div>':'')+'<div class="plan">'+plan+'</div>';
    if(x.ot)h+='<div class="otline">Heures sup : '+tfmt(x.ot.start)+' - '+tfmt(x.ot.end)+' ('+hm(x.otm)+')</div>';
    h+='</div><div class="btns">';
    if(x.leave)h+='<button class="btn ghost small" data-act="rmleave" data-ds="'+x.ds+'">Retirer le congé</button>';
    else h+='<button class="btn small" data-act="ot" data-ds="'+x.ds+'">'+(x.ot?'Modifier les heures sup':'Heures sup')+'</button><button class="btn ghost small" data-act="hours" data-ds="'+x.ds+'">Modifier les horaires</button>';
    h+='</div></article>';
  });
  h+='<section class="card wktot" aria-label="Totaux de la semaine"><span>Heures de la semaine : '+hm(totW)+'</span><span>Heures sup : '+hm(supW)+'</span></section>';

/* ---------------- Page 2 : mois ---------------- */
function tableHtml(M){
  var h='<div class="tablewrap" tabindex="0" aria-label="Tableau du mois"><table class="rec"><thead><tr><th>Jour</th><th>Horaires</th><th>Heures sup<br><small>de - à</small></th><th class="r">Durée<br>sup</th><th class="r">Total<br>jour</th><th>Mention</th></tr></thead><tbody>';
  M.groups.forEach(function(g){
    h+='<tr class="wk'+(g.hasLeave?' wkleave':'')+'"><td colspan="6">'+esc(g.header)+'</td></tr>';
    g.days.forEach(function(x){
      var r=rowOf(x),cls=x.leave?'leave':(!x.slots.length&&!x.ot?'rest':'');
      if(x.hol)cls+=' hol';
      h+='<tr class="'+cls+'"><td class="d">'+esc(r.jour)+'</td><td>'+esc(r.hor)+'</td><td>'+esc(r.sup)+'</td><td class="r">'+esc(r.supDur)+'</td><td class="r">'+esc(r.total)+'</td><td>'+esc(r.ment)+'</td></tr>';
    });
  });
  h+='</tbody><tfoot><tr><td colspan="3" class="r">Total du mois</td><td class="r">'+hm(M.st.sup)+'</td><td class="r">'+hm(M.st.total)+'</td><td></td></tr></tfoot></table></div>';
  return h;
}
function renderMonth(){
  var M=monthModel(mY,mM,S),label=cap(MONTHS[mM])+' '+mY;
  var h='<div id="notice" class="notice" role="alert" hidden>Ce navigateur n\'enregistre pas tes saisies. Télécharge ton relevé avant de fermer la page.</div>';

  h+='<div class="mnav"><button class="btn ghost" data-act="mprev" aria-label="Mois précédent">‹</button><div class="mlabel">'+esc(label)+'</div><button class="btn ghost" data-act="mnext" aria-label="Mois suivant">›</button></div>';
  h+='<button class="btn ghost block" data-act="mtoday">Revenir au mois en cours</button>';
  h+='<div class="remind"><strong>Pense à télécharger ton relevé avant la fin du mois.</strong><small>Tes saisies sont enregistrées sur ce téléphone seulement. Ce rappel n\'apparaît pas dans le fichier envoyé à la comptable.</small></div>';
  h+='<div class="tiles"><div class="tile main"><span>Heures sup du mois</span><strong>'+hm(M.st.sup)+'</strong></div><div class="tile"><span>Congés payés</span><strong>'+M.st.cp+' j</strong></div><div class="tile"><span>Maladie</span><strong>'+M.st.mal+' j</strong></div>'+(M.st.aut?'<div class="tile"><span>Autres congés</span><strong>'+M.st.aut+' j</strong></div>':'')+'</div>';
  h+=tableHtml(M);
  h+='<label class="fld" for="comment">Commentaire du mois<textarea id="comment" placeholder="Exemple : j\'ai travaillé le jeudi 1er novembre (férié), 4 h."></textarea></label>';
  h+='<div class="row"><button class="btn" data-act="pdf" id="b-pdf">Télécharger en PDF</button><button class="btn" data-act="xlsx" id="b-xlsx">Télécharger en Excel</button></div><p class="status" id="status" role="status"></p>';
  $('app').innerHTML=h;
  $('comment').value=S.comments[ym(mY,mM)]||'';

function render(){if(view==='week')renderWeek();else renderMonth();}

/* ---------------- Fenêtres de saisie ---------------- */
var sheetDs=null;
function openSheet(html){
  $('sheet').innerHTML=html;$('sheetBack').hidden=false;sheetOpen=true;document.body.classList.add('noscroll');
  var f=$('sheet').querySelector('input,button');if(f)f.focus();
}
function closeSheet(){$('sheetBack').hidden=true;sheetOpen=false;sheetDs=null;document.body.classList.remove('noscroll');}
function field(label,inner){return '<label class="fld"><span>'+label+'</span>'+inner+'</label>';}
function setErr(t){var e=$('sheet-err');if(e)e.textContent=t||'';}

function openOt(ds){
  var x=info(ds,S),cur=S.ot[ds];sheetDs=ds;
  var s=cur?cur.start:(x.slots.length?x.slots[x.slots.length-1][1]:''),e=cur?cur.end:'';
  var hint=x.slots.length?'Ta journée prévue se termine à '+tfmt(x.slots[x.slots.length-1][1])+'. Note seulement les heures en plus.':'Note seulement les heures en plus.';
  openSheet('<h2 id="sheetTitle">Heures sup</h2><p class="ctx">'+esc(dayTitle(x))+'</p><p class="hint">'+hint+'</p>'+
    '<div class="two">'+field('Début','<input type="time" id="ot-s" value="'+s+'">')+field('Fin','<input type="time" id="ot-e" value="'+e+'">')+'</div>'+
    '<p class="calc" id="ot-calc"></p><p class="err" id="sheet-err" role="alert"></p>'+
    '<div class="sbtns"><button class="btn" data-act="ot-save">Enregistrer</button>'+(cur?'<button class="btn danger" data-act="ot-del">Supprimer ces heures sup</button>':'')+'<button class="btn ghost" data-act="close">Annuler</button></div>');
  updOt();
}
function updOt(){
  var s=$('ot-s'),e=$('ot-e'),c=$('ot-calc');if(!s||!e||!c)return;
  if(s.value&&e.value&&mins(e.value)>mins(s.value))c.textContent='Durée : '+hm(mins(e.value)-mins(s.value));else c.textContent='';
}
function saveOt(){
  var s=$('ot-s').value,e=$('ot-e').value;
  if(!s||!e)return setErr('Indique l\'heure de début et l\'heure de fin.');
  if(mins(e)<=mins(s))return setErr('L\'heure de fin doit être après l\'heure de début.');
  S.ot[sheetDs]={start:s,end:e};save();closeSheet();render();toast('Heures sup enregistrées');
}

function openHours(ds){
  var x=info(ds,S),sl=x.slots;sheetDs=ds;
  function v(i,j){return sl[i]?sl[i][j]:'';}
  openSheet('<h2 id="sheetTitle">Horaires du jour</h2><p class="ctx">'+esc(dayTitle(x))+'</p><p class="hint">Change les horaires si tu as échangé ta journée avec une collègue. Laisse l\'après-midi vide pour une seule plage.</p>'+
    '<fieldset><legend>Matin</legend><div class="two">'+field('De','<input type="time" id="h1a" value="'+v(0,0)+'">')+field('À','<input type="time" id="h1b" value="'+v(0,1)+'">')+'</div></fieldset>'+
    '<fieldset><legend>Après-midi</legend><div class="two">'+field('De','<input type="time" id="h2a" value="'+v(1,0)+'">')+field('À','<input type="time" id="h2b" value="'+v(1,1)+'">')+'</div></fieldset>'+
    '<p class="err" id="sheet-err" role="alert"></p>'+
    '<div class="sbtns"><button class="btn" data-act="h-save">Enregistrer ces horaires</button><button class="btn ghost" data-act="h-rest">Repos ce jour</button>'+(x.src==='custom'?'<button class="btn ghost" data-act="h-reset">Remettre le planning prévu</button>':'')+'<button class="btn ghost" data-act="close">Annuler</button></div>');
}
function saveHours(){
  var a=$('h1a').value,b=$('h1b').value,c=$('h2a').value,d=$('h2b').value,slots=[];
  if(!a&&!b&&!c&&!d)return setErr('Indique au moins une plage, ou choisis « Repos ce jour ».');
  if(!a||!b){return setErr('Indique l\'heure de début et de fin du matin.');}
  if(mins(b)<=mins(a))return setErr('La fin du matin doit être après son début.');
  slots.push([a,b]);
  if(c||d){
    if(!c||!d)return setErr('Indique le début et la fin de l\'après-midi, ou laisse les deux vides.');
    if(mins(d)<=mins(c))return setErr('La fin de l\'après-midi doit être après son début.');
    if(mins(c)<mins(b))return setErr('L\'après-midi doit commencer après la fin du matin.');
    slots.push([c,d]);
  }
  S.days[sheetDs]={slots:slots};save();closeSheet();render();toast('Horaires enregistrés');
}

function leaveDays(a,b){
  var out=[],d=parse(a),end=parse(b),n=0;
  while(d<=end&&n<400){var ds=ymd(d);if(plannedFor(ds).length)out.push(ds);d=addDays(d,1);n++;}
  return out;
}
function openLeave(){
  var base=(ymd(today)>=ymd(weekStart)&&ymd(today)<=ymd(addDays(weekStart,6)))?ymd(today):ymd(weekStart);
  openSheet('<h2 id="sheetTitle">Poser un congé</h2><p class="hint">Choisis le type, puis le premier et le dernier jour. Les jours de repos de la période ne sont pas comptés.</p>'+
    '<fieldset><legend>Type</legend><div class="types"><label><input type="radio" name="lvt" value="CP" checked><span>Congé payé</span></label><label><input type="radio" name="lvt" value="Maladie"><span>Maladie</span></label><label><input type="radio" name="lvt" value="Autre"><span>Autre congé</span></label></div></fieldset>'+
    '<div class="two">'+field('Premier jour','<input type="date" id="lv-a" value="'+base+'">')+field('Dernier jour','<input type="date" id="lv-b" value="'+base+'">')+'</div>'+
    '<p class="calc" id="lv-calc"></p><p class="err" id="sheet-err" role="alert"></p>'+
    '<div class="sbtns"><button class="btn" data-act="lv-save">Poser ce congé</button><button class="btn ghost" data-act="close">Annuler</button></div>');
  updLv();
}
function updLv(){
  var a=$('lv-a'),b=$('lv-b'),c=$('lv-calc');if(!a||!b||!c)return;
  if(a.value&&b.value&&b.value>=a.value){var n=leaveDays(a.value,b.value).length;c.textContent=n+' jour'+(n>1?'s':'')+' de travail concerné'+(n>1?'s':'');}else c.textContent='';
}
function saveLeave(){
  var a=$('lv-a').value,b=$('lv-b').value,t=$('sheet').querySelector('input[name="lvt"]:checked').value;
  if(!a||!b)return setErr('Indique le premier et le dernier jour.');
  if(b<a)return setErr('Le dernier jour doit être après le premier.');
  var list=leaveDays(a,b);
  if(!list.length)return setErr('Aucun jour de travail dans cette période.');
  list.forEach(function(ds){S.leave[ds]=t;delete S.ot[ds];});
  save();closeSheet();
  if(a<ymd(weekStart)||a>ymd(addDays(weekStart,6)))weekStart=mondayOf(parse(a));
  render();toast(list.length+' jour'+(list.length>1?'s':'')+' posé'+(list.length>1?'s':''));
}

/* ---------------- Exports ---------------- */
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'));};document.head.appendChild(s);});}
async function saveFile(name,blob){
  var dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(dl){
    try{await dl.save({filename:name,data:blob});return 'saved';}
    catch(e){if(e&&e.code==='declined')return 'declined';}
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
  return 'saved';
}
function setStatus(t){var s=$('status');if(s)s.textContent=t;}
async function doExport(kind){
  var bp=$('b-pdf'),bx=$('b-xlsx');bp.disabled=true;bx.disabled=true;setStatus('Préparation du fichier…');
  try{
    var M=monthModel(mY,mM,S),cm=($('comment').value||'').trim(),base='Releve-heures-Saucet-'+mY+'-'+pad(mM+1),blob,name;
    if(kind==='pdf'){
      if(!window.jspdf)await loadScript(JSPDF);
      if(!window.jspdf.jsPDF.API.autoTable)await loadScript(AUTOT);
      blob=buildPdf(window.jspdf.jsPDF,M,cm).output('blob');name=base+'.pdf';
    }else{
      if(!window.ExcelJS)await loadScript(EXCEL);
      var buf=await buildXlsx(window.ExcelJS,M,cm).xlsx.writeBuffer();
      blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});name=base+'.xlsx';
    }
    var r=await saveFile(name,blob);
    setStatus(r==='declined'?'Téléchargement annulé.':'Fichier prêt : '+name+'. Cherche-le dans tes téléchargements.');
  }catch(err){setStatus('Impossible de créer le fichier. Vérifie ta connexion internet puis réessaie.');}
  bp.disabled=false;bx.disabled=false;
}

/* ---------------- Événements ---------------- */
function goMonth(){var th=addDays(weekStart,3);mY=th.getFullYear();mM=th.getMonth();view='month';render();window.scrollTo(0,0);}
function goWeek(){
  var th=addDays(weekStart,3);
  if(th.getFullYear()!==mY||th.getMonth()!==mM){
    weekStart=(mY===today.getFullYear()&&mM===today.getMonth())?mondayOf(today):mondayOf(new Date(mY,mM,1,12));
  }
  view='week';render();window.scrollTo(0,0);
}
function shiftMonth(n){var d=new Date(mY,mM+n,1,12);mY=d.getFullYear();mM=d.getMonth();render();}
document.addEventListener('click',function(e){
  if(e.target===$('sheetBack')){closeSheet();return;}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),ds=t.getAttribute('data-ds');
  switch(a){
    case 'prev':weekStart=addDays(weekStart,-7);render();break;
    case 'next':weekStart=addDays(weekStart,7);render();break;
    case 'today':weekStart=mondayOf(today);render();break;
    case 'month':goMonth();break;
    case 'back':goWeek();break;
    case 'mprev':shiftMonth(-1);break;
    case 'mnext':shiftMonth(1);break;
    case 'mtoday':mY=today.getFullYear();mM=today.getMonth();render();break;
    case 'ot':openOt(ds);break;
    case 'hours':openHours(ds);break;
    case 'leave':openLeave();break;
    case 'rmleave':delete S.leave[ds];save();render();toast('Congé retiré');break;
    case 'close':closeSheet();break;
    case 'ot-save':saveOt();break;
    case 'ot-del':delete S.ot[sheetDs];save();closeSheet();render();toast('Heures sup supprimées');break;
    case 'h-save':saveHours();break;
    case 'h-rest':S.days[sheetDs]={slots:[]};save();closeSheet();render();toast('Journée en repos');break;
    case 'h-reset':delete S.days[sheetDs];save();closeSheet();render();toast('Planning prévu remis');break;
    case 'lv-save':saveLeave();break;
    case 'pdf':doExport('pdf');break;
    case 'xlsx':doExport('xlsx');break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='jump'&&t.value){weekStart=mondayOf(parse(t.value));render();}
  if(t.id==='lv-a'){var b=$('lv-b');if(b&&(!b.value||b.value<t.value))b.value=t.value;updLv();}
  if(t.id==='lv-b')updLv();
});
var cT;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='ot-s'||t.id==='ot-e')updOt();
  if(t.id==='lv-a'||t.id==='lv-b')updLv();
  if(t.id==='comment'){clearTimeout(cT);var k=ym(mY,mM),v=t.value;cT=setTimeout(function(){if(v.trim())S.comments[k]=v;else delete S.comments[k];save();},300);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet();});

load();render();
})();

</script>
